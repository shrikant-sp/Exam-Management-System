{% extends 'base.html' %}

{% block cardclass %}
form-card
{% endblock %}

{% block content %}

<h2>Forgot Password</h2>

<p class="muted">
    Enter the registered email address to receive a password reset link.
</p>

<form method="post">

<label for="email">
    Email Address
</label>

<input
    type="email"
    id="email"
    name="email"
    placeholder="Enter your registered email"
    autocomplete="email"
    required
>

<button type="submit">
    Send Reset Link
</button>

</form>

{% endblock %}
