{% extends 'base.html' %}

{% block cardclass %}
form-card
{% endblock %}

{% block content %}

<h2>Reset Password</h2>

<form method="post">

<label for="password">Enter New Password</label>
<input
    type="password"
    id="password"
    name="password"
    placeholder="Enter new password"
    minlength="6"
    required
>

<label for="confirm">Confirm Password</label>
<input
    type="password"
    id="confirm"
    name="confirm"
    placeholder="Confirm new password"
    minlength="6"
    required
>

<button type="submit">
    Reset Password
</button>

</form>

{% endblock %}
