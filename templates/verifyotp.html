{% extends 'base.html' %}

{% block bodyclass %}auth-page{% endblock %}
{% block cardclass %}auth-card otp-card{% endblock %}

{% block content %}
<style>
.otp-card{text-align:center}.otp-card .auth-logo{display:block;width:135px;height:135px;object-fit:contain;margin:0 auto 24px}.otp-card .auth-form input{text-align:center;letter-spacing:9px;font-size:24px}
</style>
<img class="auth-logo" src="{{ url_for('static', filename='sandip-foundation-logo.png') }}" alt="Sandip Foundation logo">
<h1 class="auth-title">Verify your email</h1>
<p class="muted">We sent a six-digit verification code to <b>{{ email }}</b>.</p>
<form class="auth-form" method="post">
    <label for="otp">Verification code</label>
    <input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required autofocus>
    <button type="submit">Verify &amp; Continue</button>
</form>
{% endblock %}
